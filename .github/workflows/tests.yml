name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }  # oldest supported version; newer images no longer ship it
          - { os: ubuntu-latest, python: "3.12" }
          # Disabled to avoid 5-10+ min GitHub Actions runner queue times; tests are run locally on macOS.
          # Uncomment if macOS CI coverage is needed later.
          # - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # Fluent uses only the standard library, so there is nothing to install.
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Antigravity hooks config is valid JSON
        run: python -c "import json, pathlib; json.loads(pathlib.Path('.agents/hooks.json').read_text(encoding='utf-8'))"
